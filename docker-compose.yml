name: ${COMPOSE_PROJECT_NAME:-wordpress}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Execute ./setup.sh primeiro}
      MYSQL_USER: ${MYSQL_USER:?Execute ./setup.sh primeiro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute ./setup.sh primeiro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute ./setup.sh primeiro}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:?Execute ./setup.sh primeiro}
      WORDPRESS_DB_USER: ${MYSQL_USER:?Execute ./setup.sh primeiro}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Execute ./setup.sh primeiro}
      WORDPRESS_TABLE_PREFIX: wp_
      SITE_URL: ${SITE_URL:?Execute ./setup.sh primeiro}
      WORDPRESS_CONFIG_EXTRA: |
        // Cloudflare termina HTTPS; o Apache local recebe HTTP.
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) &&
            in_array('https', array_map('trim', explode(',', $$_SERVER['HTTP_X_FORWARDED_PROTO'])), true)) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', rtrim(getenv('SITE_URL'), '/'));
        define('WP_SITEURL', WP_HOME);
        define('FORCE_SSL_ADMIN', strpos(WP_HOME, 'https://') === 0);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wordpress_data:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - outbound

networks:
  backend:
    internal: true
  outbound:

volumes:
  mysql_data:
  wordpress_data:
